<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>test</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .center-sec {
        /* background-color: yellow; */
        width: 70%;
        height: 70%;
        display: flex;
        flex-direction: row;
      }
      .left-sec {
        width: 50%;
        height: 100;
        background-color: rgb(69, 69, 117);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .right-sec {
        width: 50%;
        height: 100;
        /* background-color: rgb(96, 86, 86); */
        display: flex;
        flex-direction: column;
      }
      .login-sec {
        /* background-color: antiquewhite; */
        width: 100%;
        height: 33%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .input-sec {
        /* background-color: blue; */
        width: 100%;
        height: 33%;
        display: flex;
        flex-direction: column;
      }
      #user {
        width: 60%;
        height: 40%;
      }
      #password {
        width: 60%;
        height: 40%;
      }
      .input1 {
        /* background-color: forestgreen; */
        width: 100%;
        height: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .input2 {
        /* background-color: rgb(130, 181, 130); */
        width: 100%;
        height: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .coneexion-sec {
        /* background-color: cadetblue; */
        width: 100%;
        height: 33%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .btn-cnx {
        width: 40%;
        height: 30%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="center-sec">
      <div class="left-sec">
        <h1>Welcome :)</h1>
      </div>
      <div class="right-sec">
        <div class="login-sec">
          <h1>Login</h1>
        </div>
        <div class="input-sec">
          <div class="input1">
            <label for="user"></label>
            <input type="text" id="user" name="user" />
          </div>
          <div class="input2">
            <label for="password"></label>
            <input type="password" id="password" name="password" />
          </div>
        </div>
        <div class="coneexion-sec">
          <button class="btn-cnx"><h4>Connexion</h4></button>
        </div>
      </div>
    </div>
  </body>
</html>
